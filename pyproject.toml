[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "conveyor-sort"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "robotic>=0.4.3",   # RAI / KOMO / BotOp; 0.4.2 does not launch simulated grippers
    "numpy",
    "opencv-python",    # HSV baseline
]

[project.optional-dependencies]
learning = [
    "ultralytics",      # YOLO
    "segment-anything", # SAM
]
eval = ["matplotlib"]     # benchmark plots
dev = ["pytest", "pytest-rerunfailures"]   # CI retries a failed test once (physics tests run in real time)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "slow: physics scenario tests (about 13 s or more each, real time); CI runs them nightly and on demand, not in every PR",
]
