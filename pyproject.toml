[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "conveyor-sort"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "robotic>=0.4.3",   # RAI / KOMO / BotOp; 0.4.2 does not launch simulated grippers
    "numpy",
    "opencv-python",    # HSV baseline
]

[project.optional-dependencies]
learning = [
    "ultralytics",      # YOLO
    "segment-anything", # SAM
]
eval = ["matplotlib"]     # benchmark plots
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
