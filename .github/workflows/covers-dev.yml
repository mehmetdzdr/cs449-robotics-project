name: covers-dev (temporary, #177, removed before review)
# Only the covered-boxes tests, fast and slow, on every push to the feature branch: physics feedback in minutes
# instead of the 70 min full run.
on:
  push:
    branches: [feat/177-covered-boxes]
jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for RAI rendering
        run: sudo apt-get update && sudo apt-get install -y xvfb libglu1-mesa libgl1 liblapack3 libfreetype6 libxrandr2 libxxf86vm1 libxi6
      - name: Install package
        run: pip install -e ".[dev,eval]"
      - name: Covered-boxes tests
        run: xvfb-run -a pytest -q -s -rfER --durations=15 tests/test_covers.py tests/test_covers_physics.py
