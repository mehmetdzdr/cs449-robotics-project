name: CI

# Pull requests and pushes to main run the fast tests (`-m "not slow"`); the full suite, with the slow physics
# scenario tests, runs nightly and on demand (Actions tab -> CI -> Run workflow). A failed test is retried once
# (physics tests run in real time and are not fully deterministic); reruns are listed in the summary (RERUN).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for RAI rendering
        run: sudo apt-get update && sudo apt-get install -y xvfb libglu1-mesa libgl1 liblapack3 libfreetype6 libxrandr2 libxxf86vm1 libxi6
      - name: Install package
        run: pip install -e ".[dev,eval]"
      - name: Environment check
        run: xvfb-run -a python scripts/check_env.py
      - name: Tests (fast) under gdb, twice (diagnostic only, not to be merged)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          sudo apt-get install -y gdb
          for k in 1 2; do
            echo "::group::fast suite, pass $k"
            xvfb-run -a gdb -q -batch -ex "handle SIGPIPE nostop noprint" -ex run -ex "echo \n=== NATIVE STACK ===\n" -ex bt \
              -ex "echo \n=== ALL THREADS ===\n" -ex "thread apply all bt 25" \
              --args python -X faulthandler -m pytest -q -m "not slow" -p no:cacheprovider -rfE 2>&1 | tee pass$k.log | tail -150
            echo "::endgroup::"
            if grep -q "NATIVE STACK" pass$k.log && grep -q "SIGSEGV" pass$k.log; then
              echo "::error::segmentation fault in pass $k, native stack above"
              grep -n -A60 "SIGSEGV" pass$k.log | head -120
              exit 1
            fi
          done
      - name: Tests (full, with the slow physics scenarios)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: xvfb-run -a pytest -q --reruns 1 -rfER
